<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instagram Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/app.js" defer></script>
</head>
<body class="min-h-screen" style="font-family: 'DM Sans', sans-serif;">
  <div id="app"></div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 hidden rounded-full px-5 py-3 text-sm font-semibold text-white shadow-lg z-50"></div>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="Close media viewer">✕</button>
    <button class="lb-prev" aria-label="Previous media">‹</button>
    <div class="lb-stage">
      <div class="lb-media"></div>
      <div class="lb-caption"></div>
    </div>
    <button class="lb-next" aria-label="Next media">›</button>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
