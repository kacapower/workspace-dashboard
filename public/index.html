<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Instagram Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/app.js" defer></script>
</head>
<body class="bg-[var(--bg)] text-[var(--ink)] antialiased selection:bg-[var(--primary)] selection:text-white pb-16 md:pb-0" style="font-family: 'Inter', sans-serif;">
  <div id="app" class="h-full"></div>

  <div id="toast" class="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-[9999] hidden rounded-full px-5 py-3 text-sm font-semibold text-white shadow-lg transition-all duration-300"></div>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="Close media viewer">✕</button>
    <button class="lb-prev" aria-label="Previous media">‹</button>
    <div class="lb-stage">
      <div class="lb-media"></div>
      <div class="lb-caption"></div>
    </div>
    <button class="lb-next" aria-label="Next media">›</button>
  </div>
</body>
</html>
